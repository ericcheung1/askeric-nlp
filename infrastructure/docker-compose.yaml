services:
  askeric-nlp:
    image: ghcr.io/ericcheung1/askeric-nlp:latest
    expose:
      - "8000"
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/askeric-nlp/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/askeric-nlp/robots.txt:/var/www/robots.txt:ro
      - /opt/askeric-nlp/sitemap.xml:/var/www/sitemap.xml:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - askeric-nlp
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: